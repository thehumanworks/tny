# tny toolchain (docs/adr/0061). `mise install` puts every tool `make quality`
# and `make test` shell out to on PATH at the exact version CI pins, so the
# gates run flag-free on macOS arm64 and Linux alike:
#
#   mise install && make quality
#
# Keep these versions in lockstep with .github/workflows/ci.yml — the
# tests/integration/test_toolchain_pins.py check fails the build otherwise.
# Without mise, the uvx fallback documented in docs/ci.md still works:
#   make quality CLANG_FORMAT='uvx clang-format@21.1.2' \
#                CLANG_TIDY='uvx clang-tidy@22.1.8' RUFF='uvx ruff@0.14.0'

[tools]
# LLVM is not in the mise registry as a versioned pair; the PyPI wheels that
# CI installs with pipx are, and they carry the same upstream binaries. mise
# drives them through uv, so uv is pinned as their prerequisite.
uv = "latest"
"pipx:clang-format" = "21.1.2"
"pipx:clang-tidy" = "22.1.8"

ruff = "0.14.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
actionlint = "1.7.12"

# Integration fixtures, the extension host, scripts/site_build.py.
python = "3.12"
# tests/site/test_term.js and sdk/typescript.
node = "22"
