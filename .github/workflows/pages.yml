name: pages

# GitHub Pages for this repo is configured as "Deploy from a branch"
# (legacy build) with source `main:/docs`. There is no artifact-based
# deploy: publishing means committing the built site into docs/ on main.
# The site sources live in site/; this workflow rebuilds the HTML and
# mirrors site/ into docs/ alongside the engineering markdown, which is
# also served (docs/*.md URLs) but never overwritten — the site build
# writes only HTML/asset paths that do not collide with the contract.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site_build.py"
      - ".github/workflows/pages.yml"
      # the landing terminal IS the wasm binary (docs/adr/0017): republish
      # whenever the product sources or the wasm seams change
      - "src/**"
      - "third_party/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      # Pages publishes the most recent *released* tag, not the temporary
      # git-describe suffix of the main-branch Pages mirror commit.
      - name: Select published version
        run: |
          tag="$(git tag --merged HEAD --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          test -n "$tag" || { echo "no reachable stable release tag" >&2; exit 1; }
          echo "TNY_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Build stripped release for measured site size
        run: make -j"$(getconf _NPROCESSORS_ONLN)" release
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - name: Build tny-web.wasm (the page terminal is the real CLI)
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" wasm-web
          mkdir -p site/assets/wasm
          cp build/wasm/tny-web.mjs build/wasm/tny-web.wasm site/assets/wasm/
      - name: Rebuild and verify static pages
        run: |
          python3 scripts/site_build.py
          python3 tests/integration/test_site.py
      - name: Mirror site/ into docs/
        run: cp -a site/. docs/
      - name: Commit and push docs/
        run: |
          # Stage before checking: the wasm artifacts land in docs/ as brand-new
          # untracked files, which `git diff` alone would not see (that skipped
          # publishing assets/wasm/ entirely and 404'd the landing terminal).
          git add docs
          if git diff --cached --quiet -- docs; then
            echo "docs/ already up to date; nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "pages: publish site to docs/ [skip ci]"
          # The release-tag render may differ from tracked site/ source until
          # tagging; discard only generated site HTML before rebasing docs/.
          git restore -- site
          git pull --rebase origin main
          git push origin main
