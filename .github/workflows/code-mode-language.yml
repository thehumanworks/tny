name: Code-mode language verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Preserve the check identifier for existing branch-protection settings.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Offline benchmark policy and mutation checks
        run: make test-code-mode-language
