# Temporary evidence workflow for post-216 cancellation; not a merge candidate.
name: Darwin shell cancellation diagnostic

on:
  push:
    branches: [cleanup/darwin-shell-diagnostic-20261018]

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the stock runner and interpreters
        run: |
          uname -s -m
          sw_vers
          /bin/bash --version
          /bin/zsh --version
      - name: Compare original and deferred-trap cancellation
        env:
          BASH: /bin/bash
          ZSH: /bin/zsh
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/tny-shell-diagnostic
        run: >-
          python3 .github/diagnostics/compare_shell_cancellation.py
          --baseline 7b5190e60b42e81532e643fe73e20da9fc2fdf71
          --candidate 9c5cac0dd1ff44384c09407925e25fe97e61025c
          --repeats 30
      - name: Retain comparison results and shell crash reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: darwin-shell-cancellation-${{ github.sha }}
          path: ${{ runner.temp }}/tny-shell-diagnostic
          retention-days: 7
