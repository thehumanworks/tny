# Shared gated tagging for automatic and explicit main-branch releases.
# Keeping this callable separately lets manual releases work while the
# automatic workflow is disabled at the repository level.
name: tag-release

on:
  workflow_call:
    inputs:
      target_sha:
        description: Commit whose CI and SDK gates must pass
        required: true
        type: string

permissions:
  contents: read

# Serialize both callers so a manual and an automatic run cannot race tags.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag and dispatch release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push the tag
      actions: write # dispatch release.yml on the tag ref
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Resolve the commit to release
        id: target
        run: |
          set -eu
          # A manual run starts from the tip of main, which is often the
          # Pages bot's "[skip ci]" mirror commit that no gate ever ran
          # on; walk back to the newest commit that did go through CI.
          sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            while git log -1 --format=%B "$sha" \
              | grep -Eqi '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; do
              sha="$(git rev-parse "$sha^1")"
            done
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "releasing from $sha: $(git log -1 --format=%s "$sha")"

      - name: Require every main-branch gate green on this commit
        id: gates
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -eu
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&branch=main&per_page=100" \
            --jq '.workflow_runs[] | [.path, .status, (.conclusion // "-"), .id] | @tsv')"
          printf '%s\n' "$runs"
          ready=true
          for path in .github/workflows/ci.yml .github/workflows/sdk.yml; do
            # newest run per workflow comes first; a re-run replaces a failure
            line="$(printf '%s\n' "$runs" | awk -F'\t' -v p="$path" '$1 == p { print; exit }')"
            if [ -z "$line" ]; then
              echo "$path: no run for $SHA yet"
              ready=false
              continue
            fi
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            if [ "$status" != completed ] || [ "$conclusion" != success ]; then
              echo "$path: $status/$conclusion"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "not every gate is green on $SHA; the next gate completion re-checks"
          fi

      - name: Compute the next version
        id: next
        if: steps.gates.outputs.ready == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -eu
          # Ignore late gates for commits from before metadata releases existed.
          if ! git cat-file -e "$SHA:release.json"; then
            echo "historical commit has no release.json request; not releasing"
            exit 0
          fi
          set -- --commit "$SHA" --github-output "$GITHUB_OUTPUT"
          python3 scripts/next_release_version.py "$@"

      - name: Create and push the tag
        if: steps.next.outputs.tag != ''
        env:
          SHA: ${{ steps.target.outputs.sha }}
          tag: ${{ steps.next.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$SHA"
          else
            git tag -a "$tag" "$SHA" -m "tny $tag"
            git push origin "refs/tags/$tag"
          fi
          echo "tagged $SHA as $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the release workflow on the tag
        if: steps.next.outputs.tag != ''
        env:
          tag: ${{ steps.next.outputs.tag }}
        run: |
          set -eu
          # A duplicate gate completion must not start duplicate publication.
          state="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "'"$tag"'") | .draft')"
          if [ "$state" = false ]; then
            echo "$tag is already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status="$(gh run list --workflow release.yml --branch "$tag" \
            --json status --jq '.[0].status // empty')"
          if [ -n "$status" ] && [ "$status" != completed ]; then
            echo "publication for $tag is already $status" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous="$(gh run list --workflow release.yml --branch "$tag" \
            --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run release.yml --ref "$tag"
          # Dispatches are asynchronous; wait until the run exists so a
          # silent no-start fails here instead of leaving a bare tag.
          for _ in $(seq 1 18); do
            sleep 10
            url="$(gh run list --workflow release.yml --branch "$tag" \
              --json url,databaseId --jq '.[0] | select(.databaseId != '"$previous"') | .url // empty')"
            if [ -n "$url" ]; then
              echo "release workflow: $url"
              echo "release workflow: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "error: release.yml did not start for $tag; dispatch it by hand:" >&2
          echo "  gh workflow run release.yml --ref $tag" >&2
          exit 1
