# Publish stripped tny binaries as GitHub release assets on v* tags.
#
# This is what makes `mise x github:thehumanworks/tny -- tny --version`
# work: mise's github backend resolves versions from GitHub *releases*
# (not CI artifacts) and picks the asset whose name matches the host
# OS/arch/libc. Asset names must keep the os-arch[-musl] triples below;
# mise autodetects from linux/darwin/windows + x86_64/aarch64/arm64 + musl.
#
# Same build matrix as ci.yml (docs/ci.md, docs/adr/0005). Never add
# Darwin Intel runners.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: binary version matches tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.8.0"
      - name: Build and compare tny --version to the tag
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          export CC=gcc TNY_VERSION="$tag"
          make -j"$(getconf _NPROCESSORS_ONLN)" release
          got="$(./build/tny --version)"
          echo "tag=$tag binary=$got"
          if [ "$got" != "$tag" ]; then
            echo "error: binary reports $got, tag is v$tag" >&2
            exit 1
          fi
      - name: Validate canonical SDK versions from the tag
        run: |
          set -eu
          node sdk/typescript/scripts/release-version.mjs "$GITHUB_REF_NAME" > /tmp/tny-sdk-versions.json
          TNY_RELEASE_TAG="$GITHUB_REF_NAME" TNY_REQUIRE_RELEASE_TAG=1 \
            python -c 'import json,sys; sys.path.insert(0,"sdk/python"); from release_version import build_version; value=json.load(open("/tmp/tny-sdk-versions.json")); assert build_version() == value["python"]'

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            triple: linux-x86_64
            node_package: linux-x64
            size_max: "1572864"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            triple: linux-aarch64
            node_package: linux-arm64
            size_max: "1572864"
          - name: darwin-arm64
            os: macos-15
            triple: darwin-arm64
            node_package: darwin-arm64
            size_max: "1887436"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.8.0"

      - name: Require Apple Silicon (not Intel x86)
        if: matrix.triple == 'darwin-arm64'
        run: |
          set -eu
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Darwin Intel/x86 is not a supported target (got $(uname -m))." >&2
            exit 1
          fi

      - name: Build, size, smoke, package
        run: |
          set -eu
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          if [ "$(uname -s)" = Linux ]; then export CC=gcc; fi
          if [ "$(uname -s)" = Darwin ]; then
            export MACOSX_DEPLOYMENT_TARGET=13.0
            export MOCK_CONNECTION_CLOSE=1 MOCK_CHUNK_WIDTH=1048576 \
              TNY_TEST_MOCK_READY_TIMEOUT=60 TNY_TEST_TURN_TIMEOUT=60 \
              TNY_TEST_SUITE_TIMEOUT=900 \
              TNY_CONFORMANCE_COMMAND_TIMEOUT=600 TNY_CONFORMANCE_STEER_TIMEOUT=180
          fi
          # version from the pushed tag; shallow checkouts have no tags for
          # `git describe` (docs/adr/0014)
          export TNY_VERSION="${GITHUB_REF_NAME#v}"
          make -j"$jobs" test
          make test-libtny-fault
          make size-check SIZE_MAX="${{ matrix.size_max }}"
          make pack TRIPLE="${{ matrix.triple }}"
          ./dist/tny-${{ matrix.triple }} --version
          # Ship a tar.gz with the binary named plain `tny` so mise (and
          # humans) get a clean bin after extraction; exec bit survives tar.
          mkdir -p dist/stage/lib/tny/tny_ext
          cp dist/tny-${{ matrix.triple }} dist/stage/tny
          cp python/tny_extension_host.py dist/stage/lib/tny/
          cp python/tny_ext/*.py python/tny_ext/py.typed dist/stage/lib/tny/tny_ext/
          tar -C dist/stage -czf dist/tny-${{ matrix.triple }}.tar.gz tny lib

      - name: Package immutable libtny SDK input
        run: |
          set -eu
          export TNY_VERSION="${GITHUB_REF_NAME#v}"
          root="$PWD/dist/libtny-root"
          make lib-shared
          make install-lib DESTDIR="$root" PREFIX=/usr/local
          mkdir -p "$root/usr/local/share/tny/abi" "$root/usr/local/share/doc/tny"
          cp abi/libtny.map abi/libtny.exports.macos "$root/usr/local/share/tny/abi/"
          cp docs/libtny.md THIRD_PARTY_NOTICES.md "$root/usr/local/share/doc/tny/"
          cp LICENSE-METADATA.json "$root/usr/local/share/tny/"
          library="$(find "$root/usr/local/lib" \
            \( -name 'libtny.0.dylib' -o -name 'libtny.so.0' \) \
            -type f -print -quit)"
          test -n "$library"
          python3 scripts/check_native_compat.py "$library"
          python3 scripts/sdk_artifact_metadata.py "$library" \
            "$root/usr/local/share/tny/ARTIFACT.json"
          python3 scripts/artifact_manifest.py "$root" \
            "$root/usr/local/share/tny/MANIFEST.sha256"
          tar -C "$root" -czf "dist/libtny-${{ matrix.triple }}.tar.gz" usr/local

      - name: Build, certify, and package language SDKs
        run: |
          set -eu
          repo="$PWD"
          conformance_timeout=180
          if [ "$(uname -s)" = Linux ]; then export CC=gcc; fi
          if [ "$(uname -s)" = Darwin ]; then
            export MACOSX_DEPLOYMENT_TARGET=13.0
            export MOCK_CONNECTION_CLOSE=1 MOCK_CHUNK_WIDTH=1048576 \
              TNY_TEST_MOCK_READY_TIMEOUT=60 TNY_TEST_TURN_TIMEOUT=60 \
              TNY_TEST_SUITE_TIMEOUT=900 \
              TNY_CONFORMANCE_COMMAND_TIMEOUT=600 TNY_CONFORMANCE_STEER_TIMEOUT=180
            conformance_timeout=1200
          fi
          export TNY_VERSION="${GITHUB_REF_NAME#v}"
          export TNY_RELEASE_TAG="$GITHUB_REF_NAME" TNY_REQUIRE_RELEASE_TAG=1
          library="$PWD/dist/libtny-root/usr/local/lib/${{ startsWith(matrix.triple, 'darwin') && 'libtny.0.dylib' || 'libtny.so.0' }}"
          metadata="$PWD/dist/libtny-root/usr/local/share/tny/ARTIFACT.json"
          sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$metadata")"
          mkdir -p "$PWD/dist/sdk"
          python -m pip install --disable-pip-version-check \
            'auditwheel>=6.4; platform_system == "Linux"' \
            'build>=1.2' 'cffi>=1.16' \
            'delocate>=0.13; platform_system == "Darwin"' \
            'mypy>=1.11' 'setuptools>=77' 'wheel>=0.45'
          dependency_wheelhouse="$(mktemp -d)"
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --dest "$dependency_wheelhouse" 'cffi>=1.16'

          PYTHONPATH="$repo/sdk/python/src" python - "$library" <<'PY'
          import os
          import sys
          import tny
          library = tny.Library(sys.argv[1])
          actual = library.version.decode("utf-8", "strict")
          assert actual == os.environ["TNY_VERSION"], (actual, os.environ["TNY_VERSION"])
          PY

          PYTHONPATH="$repo/sdk/python/src" TNY_TEST_LIBRARY="$library" \
            python -m unittest discover -s sdk/python/tests -p 'test_*.py' -v
          PYTHONPATH="$repo/sdk/python/src" mypy --strict \
            sdk/python/src/tny sdk/python/tests/typecheck_usage.py \
            sdk/python/conformance_adapter.py
          wheel_stage="$(mktemp -d)"
          TNY_BUNDLE_LIBRARY="$library" TNY_BUNDLE_SHA256="$sha" \
            TNY_BUNDLE_MANIFEST="$metadata" python -m build --wheel \
            --outdir "$wheel_stage" sdk/python
          wheel="$(find "$wheel_stage" -name '*.whl' -type f -print -quit)"
          if [ "$(uname -s)" = Darwin ]; then
            delocate-listdeps "$wheel"
            cp "$wheel" "$repo/dist/sdk/"
          else
            auditwheel show "$wheel"
            auditwheel repair --wheel-dir "$repo/dist/sdk" "$wheel"
          fi
          release_wheel="$(find "$repo/dist/sdk" -name 'tny-*.whl' -type f -print -quit)"
          test -n "$release_wheel"

          PYTHONPATH="$repo/sdk/python/src" TNY_TEST_LIBRARY="$library" \
            python sdk/conformance/run.py --artifact "$library" \
            --report "$repo/dist/sdk/conformance-${{ matrix.triple }}-reference.json" \
            --timeout "$conformance_timeout" \
            -- python sdk/conformance/adapters/c_reference.py
          python_stage="$(mktemp -d)"
          python -m venv "$python_stage/venv"
          "$python_stage/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-index \
            --find-links "$dependency_wheelhouse" "$release_wheel"
          python_version="$(PYTHONPATH="$repo/sdk/python" python -c 'from release_version import version_from_tag; import os; print(version_from_tag(os.environ["GITHUB_REF_NAME"]))')"
          "$python_stage/venv/bin/python" -c \
            'import importlib.metadata,sys,tny; expected=sys.argv[1]; assert tny.__version__ == expected == importlib.metadata.version("tny")' \
            "$python_version"
          TNY_CONFORMANCE_USE_INSTALLED=1 python sdk/conformance/run.py \
            --artifact "$release_wheel" \
            --report "$repo/dist/sdk/conformance-${{ matrix.triple }}-python-wheel.json" \
            --timeout "$conformance_timeout" \
            -- "$python_stage/venv/bin/python" sdk/python/conformance_adapter.py

          export TNY_INCLUDE_DIR="$repo/dist/libtny-root/usr/local/include"
          export TNY_LIB_DIR="$repo/dist/libtny-root/usr/local/lib"
          export TNY_ARTIFACT_METADATA="$metadata"
          export TNY_EXPECTED_LIB_SHA256="$sha"
          npm --prefix sdk/typescript run build
          npm --prefix sdk/typescript test
          python sdk/conformance/run.py \
            --artifact "$repo/sdk/typescript/build/Release/tny.node" \
            --report "$repo/dist/sdk/conformance-${{ matrix.triple }}-typescript.json" \
            --timeout "$conformance_timeout" \
            -- node sdk/typescript/test/conformance-adapter.mjs
          node sdk/typescript/scripts/package-release.mjs \
            --tag "$GITHUB_REF_NAME" --triple "${{ matrix.triple }}" \
            --wheel "$release_wheel" --commit "$GITHUB_SHA" \
            --out "$repo/dist/sdk"
          npm_version="$(node -e 'import("./sdk/typescript/scripts/release-version.mjs").then(({versionsFromTag}) => process.stdout.write(versionsFromTag(process.env.GITHUB_REF_NAME).npm))')"
          package="$repo/dist/sdk/thehumanworks-tny-${npm_version}.tgz"
          native_package="$repo/dist/sdk/thehumanworks-tny-${{ matrix.node_package }}-${npm_version}.tgz"
          test -f "$package" -a -f "$native_package"
          python scripts/validate_sdk_release.py --tag "$GITHUB_REF_NAME" \
            --root "$repo/dist/sdk" --commit "$GITHUB_SHA" --allow-partial
          TNY_NATIVE_PACKAGE_TARBALL="$native_package" \
          python sdk/conformance/run.py \
            --artifact "$package" \
            --report "$repo/dist/sdk/conformance-${{ matrix.triple }}-typescript-package.json" \
            --timeout "$conformance_timeout" \
            -- node sdk/typescript/test/conformance-adapter.mjs

          install_stage="$(mktemp -d)"
          unset TNY_INCLUDE_DIR TNY_LIB_DIR TNY_ARTIFACT_METADATA \
            TNY_EXPECTED_LIB_SHA256
          cd "$install_stage"
          npm init -y >/dev/null
          npm_config_audit=false npm_config_fund=false npm_config_offline=true \
            npm_config_cache="$install_stage/npm-cache" \
            npm install "$native_package" "$package"
          mkdir workspace
          node --input-type=module - "$install_stage/workspace" <<'JS'
          import { Runtime } from "@thehumanworks/tny";
          const runtime = await Runtime.create({ workspace: process.argv[2] });
          if ((runtime.abiVersion & 0xffff) < 5) throw new Error("ABI too old");
          await runtime.close();
          JS

      - uses: actions/upload-artifact@v7
        with:
          name: release-tny-${{ matrix.triple }}
          path: |
            dist/tny-${{ matrix.triple }}.tar.gz
            dist/libtny-${{ matrix.triple }}.tar.gz
            dist/sdk/*
          if-no-files-found: error

  musl:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            triple: linux-x86_64-musl
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            triple: linux-aarch64-musl
    steps:
      - uses: actions/checkout@v7

      - name: Static musl build in Alpine
        run: |
          set -eu
          # the container has no git; pass the version from the pushed tag
          docker run --rm -v "$PWD":/src -w /src \
            -e TNY_VERSION="${GITHUB_REF_NAME#v}" alpine:3.21 \
            sh -c 'apk add --no-cache build-base \
              && make -j"$(getconf _NPROCESSORS_ONLN)" release STATIC=1 \
              && make size-check SIZE_MAX=1572864 STATIC=1 \
              && make pack TRIPLE='"${{ matrix.triple }}"' STATIC=1 \
              && ./dist/tny-'"${{ matrix.triple }}"' --version \
              && mkdir -p dist/stage/lib/tny/tny_ext \
              && cp dist/tny-'"${{ matrix.triple }}"' dist/stage/tny \
              && cp python/tny_extension_host.py dist/stage/lib/tny/ \
              && cp python/tny_ext/*.py python/tny_ext/py.typed dist/stage/lib/tny/tny_ext/ \
              && tar -C dist/stage -czf dist/tny-'"${{ matrix.triple }}"'.tar.gz tny lib'
          # dist/ is root-owned (created by the container), so package inside
          # the container and only inspect from the host.
          if ldd dist/tny-${{ matrix.triple }} >/tmp/ldd.out 2>&1; then
            echo "error: musl binary is dynamically linked:" >&2
            cat /tmp/ldd.out >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-tny-${{ matrix.triple }}
          path: dist/tny-${{ matrix.triple }}.tar.gz
          if-no-files-found: error

  windows:
    name: windows-x86_64
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc make python zip
          path-type: minimal

      - name: Build, size, smoke, package
        run: |
          set -eu
          export TNY_VERSION="${GITHUB_REF_NAME#v}"
          make -j"$(nproc)" release
          make size-check SIZE_MAX=2097152
          make pack TRIPLE=windows-x86_64
          ./dist/tny-windows-x86_64.exe --version
          # The MSYS binary needs msys-2.0.dll next to it; zip keeps them
          # together and is the preferred archive format on Windows.
          mkdir -p dist/stage/lib/tny/tny_ext
          cp dist/tny-windows-x86_64.exe dist/stage/tny.exe
          cp /usr/bin/msys-2.0.dll dist/stage/
          cp python/tny_extension_host.py dist/stage/lib/tny/
          cp python/tny_ext/*.py python/tny_ext/py.typed dist/stage/lib/tny/tny_ext/
          (cd dist/stage && zip -r ../tny-windows-x86_64.zip tny.exe msys-2.0.dll lib)

      - uses: actions/upload-artifact@v7
        with:
          name: release-tny-windows-x86_64
          path: dist/tny-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, musl, windows, validate-registries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-tny-*
          path: assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd assets
          sha256sum tny-* libtny-* conformance-* thehumanworks-* > SHA256SUMS
          ls -l
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "tny $GITHUB_REF_NAME" \
            --generate-notes \
            tny-* libtny-* conformance-* thehumanworks-* SHA256SUMS

  validate-registries:
    name: validate complete SDK registry set
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-tny-*
          path: registry-assets
      - name: Verify versions, contents, hashes, and cross-runner identity
        run: |
          set -eu
          python scripts/validate_sdk_release.py \
            --tag "$GITHUB_REF_NAME" --root registry-assets --commit "$GITHUB_SHA"

  publish-npm:
    name: publish npm SDKs with trusted publishing
    if: vars.TNY_REGISTRY_PUBLICATION_ENABLED == 'true'
    needs: [publish, validate-registries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.8.0"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: release-tny-*
          path: registry-assets
      - name: Fail closed unless the owner license is publishable
        run: |
          set -eu
          python scripts/validate_sdk_release.py --tag "$GITHUB_REF_NAME" \
            --root registry-assets --commit "$GITHUB_SHA" \
            --require-publishable-license --repo "$PWD"
      - name: Publish or verify native packages, then the meta package
        run: |
          set -eu
          npm_version="$(node -e 'import("./sdk/typescript/scripts/release-version.mjs").then(({versionsFromTag}) => process.stdout.write(versionsFromTag(process.env.GITHUB_REF_NAME).npm))')"
          node scripts/publish_npm_release.mjs --root registry-assets \
            --version "$npm_version" --readback-attempts 30

  publish-pypi:
    name: publish Python SDK with trusted publishing
    if: vars.TNY_REGISTRY_PUBLICATION_ENABLED == 'true'
    needs: [publish, validate-registries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-tny-*
          path: registry-assets
      - name: Fail closed unless the owner license is publishable
        id: pypi-plan
        run: |
          set -eu
          python scripts/validate_sdk_release.py --tag "$GITHUB_REF_NAME" \
            --root registry-assets --commit "$GITHUB_SHA" \
            --require-publishable-license --repo "$PWD"
          mkdir -p dist/pypi
          find registry-assets -name 'tny-*.whl' -type f -exec cp {} dist/pypi/ \;
          python_version="$(PYTHONPATH="$PWD/sdk/python" python -c 'from release_version import version_from_tag; import os; print(version_from_tag(os.environ["GITHUB_REF_NAME"]))')"
          python scripts/publish_pypi_release.py --mode plan --root dist/pypi \
            --version "$python_version" --github-output "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi-plan.outputs.publish_required == 'true'
        with:
          packages-dir: dist/pypi
          attestations: true
      - name: Verify PyPI JSON, downloads, and clean installed import
        run: |
          set -eu
          python_version="$(PYTHONPATH="$PWD/sdk/python" python -c 'from release_version import version_from_tag; import os; print(version_from_tag(os.environ["GITHUB_REF_NAME"]))')"
          python scripts/publish_pypi_release.py --mode readback --root dist/pypi \
            --version "$python_version" --download-dir dist/pypi-readback --attempts 30
          python -m venv /tmp/tny-pypi-readback
          PIP_EXTRA_INDEX_URL= /tmp/tny-pypi-readback/bin/python -m pip install --disable-pip-version-check \
            --no-cache-dir --index-url https://pypi.org/simple/ "tny==$python_version"
          /tmp/tny-pypi-readback/bin/python - "$python_version" "${GITHUB_REF_NAME#v}" <<'PY'
          import importlib.metadata
          import sys
          import tny
          assert importlib.metadata.version("tny") == tny.__version__ == sys.argv[1]
          assert tny.Library().version.decode("utf-8", "strict") == sys.argv[2]
          PY

  registry-publication-status:
    name: coordinate SDK registry publication status
    if: always() && vars.TNY_REGISTRY_PUBLICATION_ENABLED == 'true'
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both registries to be verified
        env:
          NPM_RESULT: ${{ needs.publish-npm.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
        run: |
          set -eu
          printf 'npm=%s pypi=%s\n' "$NPM_RESULT" "$PYPI_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$NPM_RESULT" = success
          test "$PYPI_RESULT" = success
