name: source-snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package working tree
        run: zip -qr tny-source.zip . -x '.git/*' 'build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: tny-source-${{ github.sha }}
          path: tny-source.zip
          retention-days: 1
