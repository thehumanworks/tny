# Build the stripped tny binary on every PR and on main.
#
# Targets (docs/ci.md, docs/adr/0005):
#   linux-x86_64, linux-aarch64          — glibc, GitHub-hosted
#   linux-x86_64-musl, linux-aarch64-musl — static alpine/musl
#   darwin-arm64                         — Apple Silicon only (no Intel/x86)
#   windows-x86_64                       — MSYS2 POSIX (msys-2.0.dll)
#
# Never add macos-*-intel / macos-*-large. Darwin Intel is not a product target.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast first-party quality gate (docs/adr/0039): format, clang-tidy,
  # strict warnings (gcc + clang), GCC -fanalyzer, Ruff, ShellCheck, shfmt,
  # actionlint, JS syntax. Tool versions are pinned here — formatter output
  # changes between major versions, so bumps are deliberate.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned linters
        run: |
          set -eu
          pipx install clang-format==21.1.2
          pipx install clang-tidy==22.1.8
          pipx install ruff==0.14.0
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          shellcheck --version

      - name: make quality
        run: make quality ANALYZER_CC=gcc-14

      - name: make warn-strict (gcc + clang)
        run: |
          set -eu
          make warn-strict CC=gcc-14
          make warn-strict CC=clang

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            triple: linux-x86_64
            size_max: "1572864"
            metal: false
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            triple: linux-aarch64
            size_max: "1572864"
            metal: false
          - name: darwin-arm64
            os: macos-15
            triple: darwin-arm64
            size_max: "1887436"
            metal: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require Apple Silicon (not Intel x86)
        if: matrix.metal
        run: |
          set -eu
          echo "host=$(uname -s) $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Darwin Intel/x86 is not a supported CI target (got $(uname -m))." >&2
            echo "Use macos-15 / macos-latest (Apple Silicon), never macos-*-intel." >&2
            exit 1
          fi

      - name: Warm python3
        if: matrix.metal
        run: python3 -c 'print("python3 ok")'

      - name: Build, test, size
        run: |
          set -eu
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          # Ubuntu's cc is gcc; macOS is clang. Keep Linux on gcc so ASan
          # links libasan (clang on some images lacks the compiler-rt asan libs).
          if [ "$(uname -s)" = Linux ]; then export CC=gcc; fi
          if [ "$(uname -s)" = Darwin ]; then
            export MACOSX_DEPLOYMENT_TARGET=13.0
            export MOCK_CHUNK_WIDTH=1048576 \
              TNY_TEST_MOCK_READY_TIMEOUT=60 TNY_TEST_TURN_TIMEOUT=60 \
              TNY_TEST_SUITE_TIMEOUT=900 \
              TNY_CONFORMANCE_COMMAND_TIMEOUT=600 TNY_CONFORMANCE_STEER_TIMEOUT=180
          fi
          make -j"$jobs" test
          make test-libtny-fault
          make test-libtny-fuzz-smoke
          make size-check SIZE_MAX="${{ matrix.size_max }}"
          make pack TRIPLE="${{ matrix.triple }}"
          ./dist/tny-${{ matrix.triple }} --version
          ./dist/tny-${{ matrix.triple }} ask --help >/dev/null
          file ./dist/tny-${{ matrix.triple }} || true
          uname -s -m

      - name: Verify or seed immutable ABI1 consumer fixture
        id: abi-fixtures
        run: make test-abi

      - name: Upload missing immutable ABI1 fixture seed
        if: ${{ failure() && steps.abi-fixtures.outcome == 'failure' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: abi1-fixture-seed-${{ matrix.triple }}
          path: build/abi-fixture-seed
          if-no-files-found: error
          retention-days: 14

      - name: Stage libtny ABI-1 and frozen ABI-0 compatibility artifacts
        run: |
          set -eu
          make lib-shared
          make install-lib DESTDIR="$PWD/dist/libtny-root" PREFIX=/usr/local

      - uses: actions/upload-artifact@v7
        with:
          name: tny-${{ matrix.triple }}
          path: dist/tny-${{ matrix.triple }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: libtny-${{ matrix.triple }}
          path: dist/libtny-root
          if-no-files-found: error

  musl:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            triple: linux-x86_64-musl
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            triple: linux-aarch64-musl
    steps:
      - uses: actions/checkout@v7

      - name: Static musl build in Alpine
        run: |
          set -eu
          docker run --rm -v "$PWD":/src -w /src alpine:3.21 \
            sh -c 'apk add --no-cache build-base python3 \
              && make -j"$(getconf _NPROCESSORS_ONLN)" release STATIC=1 \
              && make test-unit SANITIZE=0 STATIC=1 \
              && make size-check SIZE_MAX=1572864 STATIC=1 \
              && make pack TRIPLE='"${{ matrix.triple }}"' STATIC=1 \
              && ./dist/tny-'"${{ matrix.triple }}"' --version \
              && ./dist/tny-'"${{ matrix.triple }}"' ask --help >/dev/null'
          file dist/tny-${{ matrix.triple }}
          # Must be a static ELF; ldd says "not a dynamic executable".
          if ldd dist/tny-${{ matrix.triple }} >/tmp/ldd.out 2>&1; then
            echo "error: musl binary is dynamically linked:" >&2
            cat /tmp/ldd.out >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tny-${{ matrix.triple }}
          path: dist/tny-${{ matrix.triple }}
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc make python
          path-type: minimal

      - name: Build, smoke, size
        run: |
          set -eu
          echo "host=$(uname -s) $(uname -m)"
          case "$(uname -s)" in
            MSYS*|MINGW*|CYGWIN*) ;;
            *) echo "expected an MSYS2 POSIX environment" >&2; exit 1 ;;
          esac
          make -j"$(nproc)" release
          make size-check SIZE_MAX=2097152
          make pack TRIPLE=windows-x86_64
          ./dist/tny-windows-x86_64.exe --version
          ./dist/tny-windows-x86_64.exe --help >/dev/null
          ./dist/tny-windows-x86_64.exe ask --help >/dev/null
          # Unit tests without ASan. Integration (pty/TUI) stays on POSIX CI.
          make test-unit SANITIZE=0
          # Runtime DLL for a usable artifact outside this runner.
          cp /usr/bin/msys-2.0.dll dist/
          ldd dist/tny-windows-x86_64.exe || true

      - uses: actions/upload-artifact@v7
        with:
          name: tny-windows-x86_64
          path: |
            dist/tny-windows-x86_64.exe
            dist/msys-2.0.dll
          if-no-files-found: error

  wasm:
    # Parity by construction (docs/adr/0017): the wasm binary must pass the
    # SAME openai integration suite against the SAME strict mocks the native
    # binary does. A drifted browser build is a red X here, not a code review
    # comment.
    name: wasm-node
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8   # the release the suite was validated against
          actions-cache-folder: emsdk-cache

      - name: Build wasm, run the openai suite under node, size guard
        run: |
          set -eu
          emcc --version | head -1
          node --version
          make -j"$(getconf _NPROCESSORS_ONLN)" wasm wasm-web
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_openai.py
          tests/integration/test_acp_ws.sh "$PWD/build/wasm/tny"
          tests/integration/test_codex_attach.sh "$PWD/build/wasm/tny"
          tests/integration/test_provider_setup.sh "$PWD/build/wasm/tny"
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_extension_capabilities.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_extension_contract.py
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_background.py
          make wasm-size-check

      - name: Browser smoke (xterm.js page runs the artifact)
        run: |
          set -eu
          pip install playwright
          python3 -m playwright install chromium --with-deps
          python3 tests/integration/test_site_wasm.py

      - uses: actions/upload-artifact@v7
        with:
          name: tny-wasm
          path: |
            build/wasm/tny.js
            build/wasm/tny.wasm
            build/wasm/tny-web.mjs
            build/wasm/tny-web.wasm
          if-no-files-found: error

  tsan:
    name: linux-x86_64-tsan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Stress independent libtny runtimes under ThreadSanitizer
        env:
          CC: gcc
          TNY_TSAN_WORKERS: "4"
          TNY_TSAN_CYCLES: "20"
        run: |
          set -eu
          gcc --version | head -1
          make test-libtny-tsan

  fuzz:
    name: linux-x86_64-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Fuzz ABI1 capacity and custom-tool validators
        env:
          FUZZ_CC: clang
          FUZZ_RUNS: "20000"
          FUZZ_SECONDS: "60"
        run: |
          set -eu
          clang --version | head -1
          make test-libtny-fuzz

      - name: Upload libFuzzer crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: libtny-fuzz-crashes-linux-x86_64
          path: build/fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: ci
    needs: [quality, build, musl, windows, wasm, tsan, fuzz]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All platform jobs succeeded
        run: |
          set -eu
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.musl.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.wasm.result }}" = "success"
          test "${{ needs.tsan.result }}" = "success"
          test "${{ needs.fuzz.result }}" = "success"
