# Build the stripped tny binary on every PR and on main.
#
# Targets (docs/ci.md, docs/adr/0005):
#   linux-x86_64, linux-aarch64          — glibc, GitHub-hosted
#   linux-x86_64-musl, linux-aarch64-musl — static alpine/musl
#   darwin-arm64                         — Apple Silicon only (no Intel/x86)
#
# Never add macos-*-intel / macos-*-large. Darwin Intel is not a product target.
#
# Linux/macOS-only CI (docs/adr/0137): linux-x86_64 runs the full suite;
# other native lanes build, unit-test and package. Nix is developer-only.
# Auto-release needs ci and sdk green on the same commit, so a main run is
# never cancelled by a newer push.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast first-party quality gate (docs/adr/0039): format, clang-tidy,
  # strict warnings (gcc + clang), GCC -fanalyzer, Ruff, ShellCheck, shfmt,
  # actionlint, JS syntax. Tool versions are pinned here — formatter output
  # changes between major versions, so bumps are deliberate.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned linters
        run: |
          set -eu
          pipx install clang-format==23.1.0
          pipx install clang-tidy==22.1.8
          pipx install ruff==0.16.6
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14 zsh tmux
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          shellcheck --version

      - name: make quality
        run: make quality ANALYZER_CC=gcc-14 ANALYZER_CXX=g++-14

      - name: Mixed C++ build and negative quality fixtures
        run: make test-cpp-build

      - name: Test Bash and Zsh workflow helpers
        run: make test-shell-workflows

      - name: Test Zsh quick ask and final terminal screen
        run: make test-shell-quick-ask

      - name: make warn-strict (gcc + clang)
        run: |
          set -eu
          make warn-strict CC=gcc-14 CXX=g++-14
          make warn-strict CC=clang CXX=clang++

  # Memory-leak gate (docs/adr/0061). valgrind has no arm64 Darwin port, so
  # Linux is where the whole unit binary and the CLI smoke get checked; macOS
  # developers run the /usr/bin/leaks flavour with `make leaks`.
  valgrind:
    name: valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind
          valgrind --version

      - name: make valgrind
        run: make valgrind && make test-native-leaks SANITIZE=0

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # `suite: full` is the one native lane that runs every integration
    # fixture; the hosted macOS runner needed over two hours for the same
    # suite, so the other lanes retain unit/ownership/fault checks and packaging.
    # Full local Nix checks remain an optional developer choice (ADR 0137).
    timeout-minutes: ${{ matrix.suite == 'full' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            triple: linux-x86_64
            suite: full
            metal: false
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            triple: linux-aarch64
            suite: unit
            metal: false
          - name: darwin-arm64
            os: macos-15
            triple: darwin-arm64
            suite: unit
            metal: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require Apple Silicon (not Intel x86)
        if: matrix.metal
        run: |
          set -eu
          echo "host=$(uname -s) $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Darwin Intel/x86 is not a supported CI target (got $(uname -m))." >&2
            echo "Use macos-15 / macos-latest (Apple Silicon), never macos-*-intel." >&2
            exit 1
          fi

      # tests/integration/test_image_exports.py (part of the full suite) runs
      # the real optional ImageMagick 7 `magick`; Ubuntu 24.04 ships 6, which
      # tny refuses on purpose. The macOS lane below supplies version 7, while
      # converter-independent cases run everywhere. tny itself never links
      # or requires it.
      - name: Install mixed-language quality fixture tools
        if: matrix.suite == 'full'
        run: |
          pipx install clang-format==23.1.0
          pipx install clang-tidy==22.1.8

      - name: Build, test, size
        run: |
          set -eu
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          # Ubuntu's cc is gcc; macOS is clang. Keep Linux on gcc so ASan
          # links libasan (clang on some images lacks the compiler-rt asan libs).
          if [ "$(uname -s)" = Linux ]; then export CC=gcc CXX=g++; fi
          if [ "$(uname -s)" = Darwin ]; then export MACOSX_DEPLOYMENT_TARGET=13.0; fi
          "${CC:-cc}" --version
          "${CXX:-c++}" --version
          if [ "${{ matrix.suite }}" = full ]; then
            make -j"$jobs" test
          else
            make -j"$jobs" test-unit release
          fi
          if [ "$(uname -s)" = Darwin ]; then
            make test-shell-workflows BASH=/bin/bash ZSH=/bin/zsh
          fi
          make test-libtny-fault
          make test-libtny-fuzz-smoke test-parser-fuzz-smoke test-parser-ownership test-search-ownership test-parser-backend-ownership test-runtime-ownership test-runner-ownership test-checkpoint-ownership test-subagent-ownership
          make size-check
          make pack TRIPLE="${{ matrix.triple }}"
          ./dist/tny-${{ matrix.triple }} --version
          ./dist/tny-${{ matrix.triple }} ask --help >/dev/null
          file ./dist/tny-${{ matrix.triple }} || true
          uname -s -m

      - name: ImageMagick 7 conversion coverage
        if: matrix.metal
        run: |
          set -eu
          if ! command -v magick >/dev/null 2>&1; then brew install imagemagick; fi
          magick -version | grep -E '^Version: ImageMagick 7\.'
          TNY="$PWD/build/tny" python3 tests/integration/test_image_exports.py

      # tnytty, the monorepo's sibling terminal app (docs/adr/0045): its own
      # Makefile, tests with ASan/UBSan, strict warnings, and a size report.
      - name: tnytty (test, strict warnings, release size)
        run: |
          set -eu
          make -C tnytty test
          make -C tnytty warn-strict
          make -C tnytty release size

      - name: Verify or seed immutable ABI1 consumer fixture
        id: abi-fixtures
        run: make test-abi

      - name: Upload missing immutable ABI1 fixture seed
        if: ${{ failure() && steps.abi-fixtures.outcome == 'failure' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: abi1-fixture-seed-${{ matrix.triple }}
          path: build/abi-fixture-seed
          if-no-files-found: error
          retention-days: 14

      - name: Stage libtny ABI-1 and frozen ABI-0 compatibility artifacts
        run: |
          set -eu
          make lib-shared
          make install-lib DESTDIR="$PWD/dist/libtny-root" PREFIX=/usr/local

      - uses: actions/upload-artifact@v7
        with:
          name: tny-${{ matrix.triple }}
          path: dist/tny-${{ matrix.triple }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: libtny-${{ matrix.triple }}
          path: dist/libtny-root
          if-no-files-found: error

  musl:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            triple: linux-x86_64-musl
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            triple: linux-aarch64-musl
    steps:
      - uses: actions/checkout@v7

      - name: Static musl build in Alpine
        run: |
          set -eu
          docker run --rm -v "$PWD":/src -w /src alpine:3.21 \
            sh -c 'apk add --no-cache build-base g++ python3 git \
              && make -j"$(getconf _NPROCESSORS_ONLN)" release STATIC=1 \
              && make test-unit test-parser-fuzz-smoke test-runner-ownership test-checkpoint-ownership test-subagent-ownership SANITIZE=0 STATIC=1 \
              && make size-check STATIC=1 \
              && make pack TRIPLE='"${{ matrix.triple }}"' STATIC=1 \
              && ./dist/tny-'"${{ matrix.triple }}"' --version \
              && ./dist/tny-'"${{ matrix.triple }}"' ask --help >/dev/null'
          file dist/tny-${{ matrix.triple }}
          # Must be a static ELF; ldd says "not a dynamic executable".
          if ldd dist/tny-${{ matrix.triple }} >/tmp/ldd.out 2>&1; then
            echo "error: musl binary is dynamically linked:" >&2
            cat /tmp/ldd.out >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tny-${{ matrix.triple }}
          path: dist/tny-${{ matrix.triple }}
          if-no-files-found: error

  wasm:
    # Parity by construction (docs/adr/0017): the wasm binary must pass the
    # SAME openai integration suite against the SAME strict mocks the native
    # binary does. A drifted browser build is a red X here, not a code review
    # comment.
    name: wasm-node
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8   # the release the suite was validated against
          actions-cache-folder: emsdk-cache

      - name: Build wasm, run the openai suite under node, size report
        run: |
          set -eu
          emcc --version | head -1
          em++ --version | head -1
          python3 -m unittest tests.integration.test_cpp_build.CppBuild.test_wasm_exception_catching
          node --version
          make -j"$(getconf _NPROCESSORS_ONLN)" wasm wasm-web wasm-dictation-fixture
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 python3 tests/integration/test_acp_client.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_openai.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_codex_chatgpt.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_prompt_cache.py
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_swarm_delivery.py
          # Shared search HTTP/auth/parser paths run on wasm too; only native
          # signal, subprocess override and runner/PTY semantics are excluded.
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_search_service.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_speech.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_dictation.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_optimise.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_tnyjev.py
          # Both image suites run whole: dimensions, strict size, manifests and
          # replay are shared C. Cross-process guard, hard-link and host
          # permission cases skip themselves with wasm's documented semantics.
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_image_service.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_image_workflow.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_image_input.py
          # The captured pending-image queue is shared C: wasm runs the byte
          # oracle that a file rewritten inside one tool batch cannot change
          # the pixels that batch already captured. The control-socket preview
          # group reports itself pending there (no fork, no AF_UNIX runner).
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_image_preview_queue.py
          # Actual producer/manifest-selected next requests use shared C;
          # socket-only controls assert a clean unsupported result on wasm.
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_image_preview_workflow.py
          # Job selection refuses before metadata/provider work; stored job
          # provenance replay uses the shared manifest and reference pipeline.
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_job_artifacts.py
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_ask_events.py "$PWD/build/wasm/tny"
          tests/integration/test_provider_setup.sh "$PWD/build/wasm/tny"
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_extension_capabilities.py
          TNY="$PWD/build/wasm/tny" python3 tests/integration/test_extension_contract.py
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_background.py
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_jobs.py "$PWD/build/wasm/tny"
          TNY="$PWD/build/wasm/tny" TNY_TEST_EXPECT_WASM=1 \
            python3 tests/integration/test_mcp_http.py
          make wasm-size-check

      - name: Browser smoke (xterm.js page runs the artifact)
        run: |
          set -eu
          pip install playwright
          python3 -m playwright install chromium --with-deps
          python3 tests/integration/test_site_wasm.py

      - uses: actions/upload-artifact@v7
        with:
          name: tny-wasm
          path: |
            build/wasm/tny.js
            build/wasm/tny.wasm
            build/wasm/tny-web.mjs
            build/wasm/tny-web.wasm
          if-no-files-found: error

  tsan:
    name: linux-x86_64-tsan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Stress independent libtny runtimes under ThreadSanitizer
        env:
          CC: gcc
          CXX: g++
          TNY_TSAN_WORKERS: "4"
          TNY_TSAN_CYCLES: "20"
        run: |
          set -eu
          gcc --version | head -1
          make test-libtny-tsan

  fuzz:
    name: linux-x86_64-fuzz
    runs-on: ubuntu-24.04
    # Instrumented builds and all ownership mutation suites exceed 12 minutes
    # on hosted runners; retain their full coverage and per-fuzzer time bounds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fuzz ABI1 capacity and custom-tool validators
        env:
          FUZZ_CC: clang
          FUZZ_CXX: clang++
          FUZZ_RUNS: "20000"
          FUZZ_SECONDS: "60"
        run: |
          set -eu
          clang --version | head -1
          make test-libtny-fuzz test-parser-fuzz test-parser-mutation test-runtime-mutation test-runner-mutation test-checkpoint-mutation test-subagent-mutation

      - name: Upload libFuzzer crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: libtny-fuzz-crashes-linux-x86_64
          path: |
            build/fuzz-artifacts
            build/parser-fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: ci
    needs: [quality, build, musl, wasm, tsan, fuzz]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All platform jobs succeeded
        run: |
          set -eu
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.musl.result }}" = "success"
          test "${{ needs.wasm.result }}" = "success"
          test "${{ needs.tsan.result }}" = "success"
          test "${{ needs.fuzz.result }}" = "success"
