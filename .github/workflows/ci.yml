# Temporary Windows diagnostic branch; never merge this workflow reduction.
# PR148 retains its complete CI/SDK/Nix acceptance matrix.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: windows-x86_64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc make python
          path-type: minimal

      - name: Build, smoke, size
        run: |
          set -eu
          echo "host=$(uname -s) $(uname -m)"
          case "$(uname -s)" in
            MSYS*|MINGW*|CYGWIN*) ;;
            *) echo "expected an MSYS2 POSIX environment" >&2; exit 1 ;;
          esac
          gcc --version
          g++ --version
          make -j"$(nproc)" release
          make size-check
          make pack TRIPLE=windows-x86_64
          ./dist/tny-windows-x86_64.exe --version
          ./dist/tny-windows-x86_64.exe --help >/dev/null
          ./dist/tny-windows-x86_64.exe ask --help >/dev/null
          # Unit tests without ASan. PTY/TUI integration stays on Unix CI.
          make test-unit test-parser-fuzz-smoke test-runner-ownership test-checkpoint-ownership SANITIZE=0
          # Runtime DLL for a usable artifact outside this runner.
          cp /usr/bin/msys-2.0.dll dist/
          ldd dist/tny-windows-x86_64.exe || true

      - name: Native durable jobs and cleanup reservations
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            echo "Windows status diagnostic attempt $attempt"
            env -u TNY_TOOLS TNY="$PWD/build/tny.exe" python3 tests/integration/test_jobs_msys.py "$PWD/build/tny.exe"
          done
          env -u TNY_TOOLS TNY="$PWD/build/tny.exe" python3 tests/integration/test_jobs_cleanup_hold.py "$PWD/build/tny.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: tny-windows-x86_64
          path: |
            dist/tny-windows-x86_64.exe
            dist/msys-2.0.dll
          if-no-files-found: error
