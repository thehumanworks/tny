# Tag and publish a release automatically after every merge to main
# (docs/adr/0085, docs/ci.md "Releases").
#
# Runs when one of the main-branch gates (ci, sdk) completes on a
# push to main. It releases only once both are green on the same
# commit: whichever gate finishes last does the work, the earlier ones
# see something still in progress and stop. release.json requests the exact
# stable version to publish; unchanged metadata does not create a new release.
# Historical commits without metadata are ignored by the workflow.
#
# A tag pushed with GITHUB_TOKEN never starts `on: push: tags`
# workflows, so this dispatches release.yml on the new tag ref instead
# (the fallback release.yml already documents). The release workflow
# then builds, tests, and publishes exactly as for a hand-pushed tag.
#
# Manual use: "Run workflow" on main cuts a release from the newest
# commit whose gates are green, using its release.json request.

name: auto-release

on:
  workflow_run:
    workflows: [ci, sdk]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: tag and dispatch release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/tag-release.yml
    permissions:
      contents: write
      actions: write
    with:
      target_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
