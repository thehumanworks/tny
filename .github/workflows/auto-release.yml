# Tag and publish a release automatically after every merge to main
# (docs/adr/0085, docs/ci.md "Releases").
#
# Runs when one of the main-branch gates (ci, sdk) completes on a
# push to main. It releases only once both are green on the same
# commit: whichever gate finishes last does the work, the earlier ones
# see something still in progress and stop. The version is not stored
# anywhere (docs/adr/0014): scripts/next_release_version.py bumps the
# newest reachable v* tag from the Conventional Commits prefixes since
# it (feat -> minor, ! / BREAKING CHANGE -> major, else patch) and
# skips commits that already carry a tag or opt out with [skip release].
#
# A tag pushed with GITHUB_TOKEN never starts `on: push: tags`
# workflows, so this dispatches release.yml on the new tag ref instead
# (the fallback release.yml already documents). The release workflow
# then builds, tests, and publishes exactly as for a hand-pushed tag.
#
# Manual use: "Run workflow" on main cuts a release from the newest
# commit whose gates are green, with an optional forced bump kind.

name: auto-release

on:
  workflow_run:
    workflows: [ci, sdk]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump kind (auto reads the commit messages)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: read

jobs:
  tag:
    name: tag and dispatch release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/tag-release.yml
    permissions:
      contents: write
      actions: write
    with:
      target_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      bump: ${{ inputs.bump || 'auto' }}
