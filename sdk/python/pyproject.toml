[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "tny"
dynamic = ["version"]
description = "Native Python SDK for the tny agent runtime and toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cffi>=1.16"]
license = "MIT"
license-files = ["LICENSE", "LICENSE-METADATA.json", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "The Human Works"}]
keywords = ["agent", "libtny", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/thehumanworks/tny"
Documentation = "https://github.com/thehumanworks/tny/blob/main/docs/sdks.md"
Issues = "https://github.com/thehumanworks/tny/issues"
Source = "https://github.com/thehumanworks/tny"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tny = ["py.typed", ".libs/*"]
