[workspace]
name = "tny-runner-evaluation"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[dependencies]
tny = { path = "." }

[package]
name = "tny"
version = "0.39.0"

[package.build.backend]
name = "pixi-build-rattler-build"

[system-requirements]
libc = { family = "glibc", version = "2.34" }
